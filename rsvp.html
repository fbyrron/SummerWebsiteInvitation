  <!--
    RSVP page (multi-page split): just the Luma RSVP iframe, filling the
    page (styles/rsvp.css). The three ambient parallax layers are
    deliberately omitted on this page - a plain, full-bleed iframe page
    reads cleaner without ambient parallax drifting behind it, and this
    page has no other decorative content for the parallax layers to sit
    behind anyway.
  -->

  <!-- The "← Back" back-link that used to sit here has been REMOVED at the

       wanted later, a `.castle-button` styled link would match the site
       rather than the plain text link that was here. -->
